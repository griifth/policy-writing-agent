# 体例模块：国际经验借鉴 / 单一政策分析 + 中国应对
#
# 适用：国外/国际某政策领域的做法、经验、机制，提炼对我国的借鉴与应对。
# 例：国外校园餐政策经验及启示、主要国家学制改革经验及我国应对、
#     国外体育教师培养聘任政策及启示、主要国家超常儿童培养政策及中国建议。
#
# 推理链：外部政策做法 -> 成因条件 -> 有效性证据 -> 迁移前提 -> 中国适配建议
#
# 本文件由 workflow/runner.py 在运行时按 --report-type 载入。
# 变量沿用通用占位符：
#   【主题】       文章主题
#   【目标国家】   参照国家/地区（借鉴体例下通常为多个，可填“美国、英国、日本”或“主要国家”）
#   【战略领域】   政策领域（如 校园餐、学制、体育教师培养）
#   【中国应对主题】中国应对/改进主题

name: experience_response
label: 国际经验借鉴 + 中国应对

# NotebookLM 六类检索任务（对应 prompts/retrieval.md 的检索任务类型）
retrieval_types:
  - practice_background      # 政策领域的问题背景与各国/地区总体情况
  - key_practices            # 各国具体政策做法与工具
  - enabling_conditions      # 做法背后的成因、制度条件与国情前提
  - effectiveness_evidence   # 实施效果与有效性证据（含证据状态）
  - china_status_and_gaps    # 中国现状、短板与制度约束
  - adaptation_evidence      # 可迁移性与中国适配的依据
