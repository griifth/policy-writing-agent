# 体例模块：国际动向研判 + 对我国的影响与对策建议
#
# 适用：某政策/技术/教育领域的国际新动向、信号、改革趋势的研判，
#       从零散信号中归纳趋势、研判所处阶段，并落到对我国的影响与对策建议。
# 例：国际工程教育改革动向研判及我国应对、世界教育数字化态势研判及对策、
#     人工智能拔尖人才培养前沿趋势研判及我国应对。
#
# 推理链（固定）：信号识别 -> 趋势归纳 -> 阶段研判 -> 对我国的影响与对策建议
#
# 体例红线：本体例不是“趋势条目堆叠综述”。无论趋势主体写得多充分，
#           必须有独立的“对我国对策建议”收尾，且每条对策从前文研判推导、不悬空。
#           工作流的存在意义就是为中国出对策；丢掉对策落点即视为未达标。
#
# 本文件由 workflow/runner.py 在运行时按 --report-type 载入。
# 变量沿用通用占位符：
#   【主题】       文章主题
#   【目标国家】   参照国家/地区（动向体例下通常为多个，可填“美国、英国、日本”或“主要国家”）
#   【战略领域】   动向所在政策/技术/教育领域（如 工程教育、教育数字化、AI 人才培养）
#   【中国应对主题】中国应对/布局主题

name: trend_review
label: 国际动向研判 + 中国对策

# NotebookLM 检索任务（对应 prompts/retrieval.md 的检索任务类型）
# 口径围绕“动向/信号—趋势—阶段—对我影响—对策依据”，不照搬战略体例的措施—意图—压力六类。
retrieval_types:
  - trend_signals            # 各国/地区的新动向、政策信号、改革举措（碎片信号源）
  - cross_country_practices  # 跨国可比的具体做法与代表案例（支撑趋势归纳）
  - driver_analysis          # 趋势背后的驱动力、成因与触发条件（为什么在发生）
  - maturity_assessment      # 趋势所处阶段与成熟度（萌芽/扩散/制度化，含证据状态）
  - china_status_and_gaps    # 中国现状、跟随位置、短板与潜在风险
  - response_evidence        # 支撑“对我国对策”的中国制度载体、试点与可行性依据

# reasoning_dna 注入映射：step(任务 id) -> 刀（report_modules/trend_review/reasoning_dna/<刀>.md）
# 刀文件缺失时该步零注入（gated）。本批先建模块、不配刀，映射留空待后续轮次补刀。
reasoning_dna_injection: {}
