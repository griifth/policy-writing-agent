<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>run 回顾页</title>
<style>
  :root{
    interpolate-size: allow-keywords;
    --bg:#f5f5f7; --card:#ffffff; --panel:#f5f5f7; --panel2:#fafafc;
    --ink:#1d1d1f; --ink2:#6e6e73; --line:#d8d8de; --line-soft:#e8e8ed;
    --accent:#0071e3; --accent-soft:rgba(0,113,227,.1); --accent-inkon:#ffffff;
    --mark:#fff7e0; --mark-line:#e0a92f; --mark-ink:#8a6414; --scrap:rgba(224,169,47,.07);
    --chip:#eef0f3; --chip-ink:#5f6b7a;
    --gou:#24a148; --gou-ink:#ffffff;
    --glass:rgba(255,255,255,.78); --glass-bg:rgba(245,245,247,.8);
    --pre-bg:#1d1d1f; --pre-ink:#d7dee8;
    --shadow-hover:0 4px 16px rgba(0,0,0,.08);
    --ease:cubic-bezier(.25,.1,.25,1);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#000000; --card:#161617; --panel:#1d1d1f; --panel2:#1c1c1e;
      --ink:#f5f5f7; --ink2:#a1a1a6; --line:#3a3a3c; --line-soft:#2c2c2e;
      --accent:#2997ff; --accent-soft:rgba(41,151,255,.16);
      --mark:rgba(224,169,47,.16); --mark-line:#a97e1f; --mark-ink:#f5c04e; --scrap:rgba(224,169,47,.1);
      --chip:#2c2c2e; --chip-ink:#a1a1a6;
      --gou:#30d158; --gou-ink:#06330f;
      --glass:rgba(22,22,23,.82); --glass-bg:rgba(0,0,0,.82);
      --pre-bg:#1d1d1f; --pre-ink:#d7dee8;
      --shadow-hover:0 4px 16px rgba(0,0,0,.5);
    }
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; padding:28px 20px 80px; background:var(--bg); color:var(--ink);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1280px; margin:0 auto;}
  h1{font-size:34px; line-height:1.3; margin:0 0 14px; font-weight:700; letter-spacing:-.01em;}
  h2{font-size:20px; font-weight:600; margin:0;}
  h3{font-size:15px; font-weight:600; margin:20px 0 10px; color:var(--ink2);}
  p{margin:6px 0;}
  ol,ul{margin:6px 0; padding-left:1.6em;}
  li{margin:4px 0;}
  code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px;}
  button,a,summary{transition:opacity .2s var(--ease), transform .2s var(--ease);}
  a:focus-visible, button:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

  /* 进入视口淡入（JS 控制；无 JS/reduced-motion 时不加 .io-pre，直接呈现） */
  .io-pre{opacity:0; transform:translateY(12px);}
  .io-pre.io-in{opacity:1; transform:translateY(0); transition:opacity .4s var(--ease), transform .4s var(--ease);}

  /* 数据抽取备注横幅 */
  #notes-banner{
    background:var(--mark); border:1px solid var(--mark-line); border-radius:12px;
    padding:10px 18px; margin-bottom:20px;
  }
  #notes-banner summary{cursor:pointer; font-size:15px; font-weight:600;}
  #notes-banner ul{margin:8px 0 6px;}
  #notes-banner li{font-size:15px;}
  #notes-banner .nf{font-weight:600;}

  /* 六区 */
  details.zone{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px;
    margin:18px 0; padding:0;
  }
  details.zone > summary{
    cursor:pointer; padding:14px 20px; font-size:20px; font-weight:600;
    list-style:none; user-select:none;
    position:sticky; top:0; z-index:5;
    background:var(--glass);
    -webkit-backdrop-filter:blur(20px) saturate(1.5); backdrop-filter:blur(20px) saturate(1.5);
    border-radius:12px 12px 0 0; border-bottom:1px solid transparent;
  }
  details.zone[open] > summary{border-bottom-color:var(--line-soft);}
  details.zone > summary::before{content:"▸ "; color:var(--accent);}
  details.zone[open] > summary::before{content:"▾ ";}
  details.zone > summary .count{font-weight:400; color:var(--ink2); font-size:13px; font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
  details.zone::details-content{
    height:0; overflow:clip;
    transition:height .3s var(--ease), content-visibility .3s allow-discrete;
  }
  details.zone[open]::details-content{height:auto;}
  .zone-body{padding:18px 20px 22px; border-radius:0 0 12px 12px;}
  .empty{color:var(--ink2); font-size:15px; padding:10px 0;}
  .src-note{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:8px;
    padding:12px 16px; font-size:15px; white-space:pre-wrap; margin-bottom:14px;
  }

  /* ① 单头卡 */
  .meta-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:12px 20px; margin:12px 0 6px;}
  .meta-item{font-size:15px; background:var(--panel); border-radius:8px; padding:10px 14px; font-variant-numeric:tabular-nums;}
  .meta-item .k{display:block; color:var(--ink2); font-size:13px; font-family:ui-monospace,Menlo,monospace; margin-bottom:2px;}
  .dir-block{margin-top:14px; border-top:1px dashed var(--line); padding-top:14px;}
  .dir-row{margin:10px 0;}
  .dir-row .k{display:block; color:var(--ink2); font-size:13px; font-family:ui-monospace,Menlo,monospace; margin-bottom:3px;}
  .chip{
    display:inline-block; background:var(--accent-soft); color:var(--accent);
    border-radius:6px; padding:2px 10px; margin:3px 6px 3px 0; font-size:13px;
  }

  /* ② 主线链视图（三列泳道） */
  .legend{font-size:13px; color:var(--ink2); margin-bottom:12px;}
  .chain{display:grid; grid-template-columns:1.1fr 1.3fr 1fr; gap:14px;}
  .chain-col{background:var(--panel); border:1px solid var(--line-soft); border-radius:12px; padding:14px;}
  .chain-col h3{margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink2); font-family:ui-monospace,Menlo,monospace; letter-spacing:1px; border-bottom:1px solid var(--line-soft); padding-bottom:8px;}
  .chain-item{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line-soft); border-radius:8px;
    padding:9px 12px; margin:0 0 8px; font-size:15px; line-height:1.6; color:var(--ink);
    font-family:inherit; transition:opacity .2s var(--ease), transform .2s var(--ease);
  }
  .chain-item:hover{transform:translateY(-1px);}
  .chain-item .sub{display:block; color:var(--ink2); font-size:13px; margin-top:3px;}
  .chain-item.active{background:var(--accent); border-color:var(--accent); color:var(--accent-inkon);}
  .chain-item.active .sub{color:var(--accent-inkon); opacity:.75;}
  .chain-item.linked{background:var(--mark); border-color:var(--mark-line);}
  .chain-item.dim{opacity:.3;}
  .chain-item .fid{font-weight:700; margin-right:6px; font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; color:var(--accent);}
  .chain-item.active .fid{color:var(--accent-inkon); opacity:.85;}
  @media (max-width:860px){ .chain{grid-template-columns:1fr;} }

  /* ③ 观点清单区 */
  .vp{border:1px solid var(--line-soft); border-radius:12px; padding:14px 18px; margin:0 0 14px; background:var(--card); transition:opacity .2s var(--ease), transform .2s var(--ease);}
  .vp:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover);}
  .vp.rejected{background:var(--panel); color:var(--ink2);}
  .vp-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px;}
  .vp-head .vid{font-weight:700; font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
  .badge{
    display:inline-block; border-radius:6px; padding:1px 9px; font-size:13px; line-height:1.7;
    background:var(--chip); color:var(--chip-ink); border:1px solid var(--line-soft);
    font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;
  }
  .badge.slot{background:var(--accent-soft); color:var(--accent); border-color:transparent;}
  .badge.st-gou{background:var(--gou); color:var(--gou-ink); border-color:transparent;}
  .badge.st-cha{background:var(--chip); color:var(--chip-ink); border-color:transparent;}
  .badge.st-gai{background:var(--mark); color:var(--mark-ink); border-color:transparent;}
  .vp .text{font-size:15px;}
  .vp.rejected .text{color:var(--ink2);}
  .vp .row{font-size:13px; color:var(--ink2); margin-top:6px;}
  .vp .row .k{color:var(--ink2); opacity:.7; margin-right:6px; font-family:ui-monospace,Menlo,monospace; font-size:13px;}
  .rev-panels{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .rev-panels > div{border:1px dashed var(--line); border-radius:8px; padding:9px 14px; font-size:15px;}
  .rev-panels .k{display:block; color:var(--ink2); font-size:13px; margin-bottom:3px; font-family:ui-monospace,Menlo,monospace;}
  @media (max-width:860px){ .rev-panels{grid-template-columns:1fr;} }
  .fchip{display:inline-block; border:1px solid var(--line); border-radius:6px; padding:1px 7px; margin:2px 4px 2px 0; font-size:13px; color:var(--ink2); font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}

  /* ④ 料包区 */
  .cat-block{margin-bottom:18px; content-visibility:auto; contain-intrinsic-size:auto 400px;}
  .mat{border:1px solid var(--line-soft); border-radius:8px; padding:12px 14px; margin:0 0 9px; background:var(--card); transition:opacity .2s var(--ease), transform .2s var(--ease);}
  .mat:hover{transform:translateY(-2px); box-shadow:var(--shadow-hover);}
  .mat .mhead{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap;}
  .mat .fid{font-weight:700; font-family:ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums; color:var(--accent);}
  .mat .summary{font-size:15px; margin-top:4px;}
  .mat .meta-line{font-size:13px; color:var(--ink2); margin-top:4px; word-break:break-all;}
  .cat-block h3{color:var(--ink); font-size:15px; background:var(--chip); border-radius:6px; padding:5px 12px; display:inline-block;}
  .scrap{border-left:3px solid var(--mark-line); background:var(--scrap); border-radius:0 8px 8px 0; padding:12px 14px; margin:0 0 10px;}
  .scrap .why{font-size:15px; color:var(--mark-ink); margin-top:4px;}
  .scrap .src{font-size:13px; color:var(--ink2); margin-top:4px; word-break:break-all;}

  /* ⑤ 闸门区 */
  .gate{margin-bottom:16px;}
  .gate h3{color:var(--ink);}
  .gate .vio{
    background:var(--panel); border:1px solid var(--line-soft); border-radius:8px;
    padding:10px 14px; margin:7px 0; font-size:15px; white-space:pre-wrap;
  }
  pre.raw{
    background:var(--pre-bg); color:var(--pre-ink); border-radius:12px;
    padding:16px 18px; font-size:13px; line-height:1.6; overflow:auto; white-space:pre-wrap; word-break:break-all;
    font-variant-numeric:tabular-nums;
  }

  /* ⑥ 预读提词区 */
  .voice-block{margin-bottom:18px;}
  .voice-block h3{color:var(--ink);}
  .sanfan{background:var(--panel); border:1px dashed var(--line); border-radius:8px; padding:12px 16px; font-size:15px; white-space:pre-wrap; margin-top:10px;}

  footer.page-foot{
    margin-top:28px; padding:14px 18px; text-align:center; font-size:13px; color:var(--ink2);
    border-top:1px solid var(--line-soft); font-family:ui-monospace,Menlo,monospace;
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{transition:none !important; animation:none !important;}
    .io-pre{opacity:1 !important; transform:none !important;}
    details.zone::details-content{transition:none !important;}
  }

  @media print{
    :root{
      --bg:#ffffff; --card:#ffffff; --panel:#f6f7f9; --panel2:#fafbfc;
      --ink:#1d1d1f; --ink2:#5f6b7a; --line:#d9dde3; --line-soft:#e5e7eb;
      --accent:#0071e3; --accent-soft:#e3ecff;
      --mark:#fff7e0; --mark-line:#e0a92f; --mark-ink:#8a6414; --scrap:#fffdf4;
      --chip:#eef0f3; --chip-ink:#5f6b7a; --gou:#24a148; --gou-ink:#ffffff;
      --pre-bg:#f6f7f9; --pre-ink:#1d1d1f;
    }
    body{background:#fff; padding:0;}
    *,*::before,*::after{transition:none !important; animation:none !important;}
    .io-pre{opacity:1 !important; transform:none !important;}
    details.zone > summary{position:static; background:var(--panel2); -webkit-backdrop-filter:none; backdrop-filter:none;}
    details.zone::details-content{height:auto !important;}
    details.zone > *:not(summary), #notes-banner > *:not(summary){display:block !important;}
    details.zone, #notes-banner{break-inside:avoid;}
    .chain-item,.vp,.mat{break-inside:avoid; box-shadow:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <details id="notes-banner"><summary id="notes-summary">数据抽取备注</summary><ul id="notes-list"></ul></details>
  <main id="zones"></main>
  <footer class="page-foot">本页内容全部抽取自 run 内文件原文；历史单中的称谓为当时实况。</footer>
</div>

<script>
"use strict";
const RUN_DATA = /*__RUN_DATA__*/;

(function(){
  const D = Object.assign({
    meta:{}, direction:{}, sections:[], viewpoints:[], selectionNote:"",
    materialsNote:"", materials:[], scraps:[], gates:[],
    precheck:{files:[]}, preread:[], decisions:[], extractionNotes:[]
  }, RUN_DATA || {});
  D.meta = D.meta || {}; D.direction = D.direction || {};
  if(!D.precheck || !Array.isArray(D.precheck.files)) D.precheck = {files:[]};

  const $ = s => document.querySelector(s);
  function el(tag, cls, text){ const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e; }
  function has(x){ if(x==null) return false; if(typeof x==="string") return x.trim()!==""; if(Array.isArray(x)) return x.length>0; return true; }
  function emptyMsg(){ return el("div","empty","本单无此件"); }

  document.title = "回顾页 · " + (D.meta.runId || "run");

  /* ── 数据抽取备注横幅 ── */
  (function(){
    const list = $("#notes-list");
    if(has(D.extractionNotes)){
      $("#notes-summary").textContent = "数据抽取备注（" + D.extractionNotes.length + " 条：哪些字段缺失、哪些靠推断）";
      D.extractionNotes.forEach(n=>{
        const li = el("li");
        li.appendChild(el("span","nf",(n.field||"") + "："));
        li.appendChild(document.createTextNode(n.note||""));
        list.appendChild(li);
      });
    }else{
      $("#notes-summary").textContent = "数据抽取备注（无：全部字段均取自原文、无推断）";
      list.appendChild(el("li",null,"无。"));
    }
  })();

  const zones = $("#zones");
  function makeZone(id, title, countText, open){
    const d = el("details","zone"); d.id = id; if(open) d.setAttribute("open","");
    const s = el("summary");
    s.appendChild(el("span",null,title));
    if(countText!=null){ s.appendChild(document.createTextNode(" ")); s.appendChild(el("span","count",countText)); }
    d.appendChild(s);
    const body = el("div","zone-body"); d.appendChild(body);
    zones.appendChild(d);
    return body;
  }

  /* ── ① 单头卡 ── */
  (function(){
    const body = makeZone("z1","① 单头卡",null,true);
    body.appendChild(el("h1",null, has(D.meta.title) ? D.meta.title : (D.meta.runId || "（无标题：成稿缺失）")));
    const grid = el("div","meta-grid");
    function mi(k,v){ if(!has(v)) v="本单无此件"; const d=el("div","meta-item"); d.appendChild(el("span","k",k)); d.appendChild(document.createTextNode(v)); grid.appendChild(d); }
    mi("run：", D.meta.runId);
    mi("日期：", D.meta.date);
    if(has(D.meta.panxing)) mi("判型：", D.meta.panxing);
    if(has(D.meta.yongtu)) mi("用途类型：", D.meta.yongtu);
    if(has(D.direction.duzhe)) mi("读者层级：", D.direction.duzhe);
    mi("勾选率：", D.meta.gouxuanlv);
    mi("执行引擎：", D.meta.engine);
    body.appendChild(grid);

    const dir = el("div","dir-block");
    function row(k, build){
      const r = el("div","dir-row"); r.appendChild(el("span","k",k));
      build(r); dir.appendChild(r);
    }
    row("议题", r=>{ r.appendChild(el("p",null, has(D.direction.yiti)?D.direction.yiti:"本单无此件")); });
    row("倾向箭头", r=>{
      if(has(D.direction.jiantou)) D.direction.jiantou.forEach(j=>r.appendChild(el("span","chip",j)));
      else r.appendChild(el("span",null,"本单无此件"));
    });
    row("禁区", r=>{
      if(has(D.direction.jinqu)){ const ul=el("ul"); D.direction.jinqu.forEach(j=>ul.appendChild(el("li",null,j))); r.appendChild(ul); }
      else r.appendChild(el("span",null,"本单无此件"));
    });
    if(has(D.direction.zhijue)) row("半成形直觉", r=>{ r.appendChild(el("p",null,D.direction.zhijue)); });
    body.appendChild(dir);
  })();

  /* 观点索引（②③ 共用） */
  const vpById = {}; D.viewpoints.forEach(v=>{ vpById[v.id]=v; });
  const checkedVps = D.viewpoints.filter(v=>v.status!=="叉");
  const secByVp = {}; D.sections.forEach(s=>{ (s.viewpointIds||[]).forEach(vid=>{ (secByVp[vid]=secByVp[vid]||[]).push(s.id); }); });

  /* ── ② 主线链视图 ── */
  (function(){
    const body = makeZone("z2","② 主线链视图","节 ⇄ 已勾观点 ⇄ 证据料",true);
    if(!has(D.sections) && !has(checkedVps)){ body.appendChild(emptyMsg()); return; }
    body.appendChild(el("p","legend","点击任一列条目，另两列高亮其关联项；再次点击该条目或点击空白处取消高亮。关联数据来自观点的“证据摘要 F 锚”与“拟落槽位”。"));
    const chain = el("div","chain");
    const colS = el("div","chain-col"), colV = el("div","chain-col"), colM = el("div","chain-col");
    colS.appendChild(el("h3",null,"成稿各节小标题")); colV.appendChild(el("h3",null,"已勾观点")); colM.appendChild(el("h3",null,"证据锚 · 料条目"));

    // 右列：已勾观点引用到的料，按 F 编号排序
    const usedF = {}; checkedVps.forEach(v=>{ (v.evidenceRefs||[]).forEach(f=>{ usedF[f]=true; }); });
    const matById = {}; D.materials.forEach(m=>{ matById[m.id]=m; });
    const fList = Object.keys(usedF).sort((a,b)=>{
      const na=parseInt((a.match(/\d+/)||["0"])[0],10), nb=parseInt((b.match(/\d+/)||["0"])[0],10); return na-nb;
    });

    const items = {}; // key -> element
    function reg(type,id,e){ items[type+":"+id]=e; }

    D.sections.forEach(s=>{
      const b = el("button","chain-item");
      b.type="button";
      b.appendChild(document.createTextNode(s.heading||s.id));
      if(has(s.mainlineSeg)) b.appendChild(el("span","sub","主线段："+s.mainlineSeg));
      if(!has(s.viewpointIds)) b.appendChild(el("span","sub","本节无对应观点"));
      b.title = (s.heading||"");
      b.dataset.type="s"; b.dataset.id=s.id;
      colS.appendChild(b); reg("s",s.id,b);
    });
    checkedVps.forEach(v=>{
      const b = el("button","chain-item");
      b.type="button";
      const short = (v.text||"").length>48 ? (v.text||"").slice(0,48)+"…" : (v.text||"");
      b.appendChild(document.createTextNode((v.slot? "〔"+v.slot+"〕 " : "") + short));
      b.title = v.text||"";
      b.dataset.type="v"; b.dataset.id=v.id;
      colV.appendChild(b); reg("v",v.id,b);
    });
    fList.forEach(f=>{
      const m = matById[f];
      const b = el("button","chain-item");
      b.type="button";
      const fid = el("span","fid",f); b.appendChild(fid);
      const txt = m ? (m.summary.length>40 ? m.summary.slice(0,40)+"…" : m.summary) : "（料包中未找到该编号）";
      b.appendChild(document.createTextNode(txt));
      if(m && has(m.tier)) b.appendChild(el("span","sub","T级："+m.tier));
      b.title = m ? (f+"｜"+m.summary) : f;
      b.dataset.type="m"; b.dataset.id=f;
      colM.appendChild(b); reg("m",f,b);
    });

    chain.appendChild(colS); chain.appendChild(colV); chain.appendChild(colM);
    body.appendChild(chain);

    /* 三级联动 */
    let selected = null; // {type,id}
    function related(type,id){
      const s=new Set(), v=new Set(), m=new Set();
      if(type==="s"){
        s.add(id);
        const sec = D.sections.find(x=>x.id===id);
        ((sec&&sec.viewpointIds)||[]).forEach(vid=>{ v.add(vid); ((vpById[vid]||{}).evidenceRefs||[]).forEach(f=>m.add(f)); });
      }else if(type==="v"){
        v.add(id);
        (secByVp[id]||[]).forEach(sid=>s.add(sid));
        ((vpById[id]||{}).evidenceRefs||[]).forEach(f=>m.add(f));
      }else{
        m.add(id);
        checkedVps.forEach(vp=>{ if((vp.evidenceRefs||[]).indexOf(id)>=0){ v.add(vp.id); (secByVp[vp.id]||[]).forEach(sid=>s.add(sid)); } });
      }
      return {s:s,v:v,m:m};
    }
    function clearHL(){
      Object.keys(items).forEach(k=>{ items[k].classList.remove("active","linked","dim"); });
      selected = null;
    }
    function applySel(type,id){
      clearHL();
      selected = {type:type,id:id};
      const r = related(type,id);
      Object.keys(items).forEach(k=>{
        const e = items[k];
        const t = e.dataset.type, i = e.dataset.id;
        if(t===type && i===id){ e.classList.add("active"); return; }
        const set = r[t];
        if(set && set.has(i)) e.classList.add("linked");
        else e.classList.add("dim");
      });
    }
    chain.addEventListener("click", ev=>{
      const b = ev.target.closest(".chain-item");
      if(!b){ clearHL(); return; }
      ev.stopPropagation();
      const t=b.dataset.type, i=b.dataset.id;
      if(selected && selected.type===t && selected.id===i){ clearHL(); return; }
      applySel(t,i);
    });
    document.addEventListener("keydown", ev=>{ if(ev.key==="Escape") clearHL(); });
  })();

  /* ── ③ 观点清单区 ── */
  (function(){
    const cnt = {};
    D.viewpoints.forEach(v=>{ cnt[v.status]=(cnt[v.status]||0)+1; });
    const countText = has(D.viewpoints)
      ? "共 "+D.viewpoints.length+" 条（勾 "+(cnt["勾"]||0)+"｜叉 "+(cnt["叉"]||0)+"｜改 "+(cnt["改"]||0)+"）"
      : null;
    const body = makeZone("z3","③ 观点清单区",countText,true);
    if(!has(D.viewpoints)){ body.appendChild(emptyMsg()); return; }
    if(has(D.selectionNote)) body.appendChild(el("div","src-note",D.selectionNote));
    const stBadge = {"勾":"badge st-gou","叉":"badge st-cha","改":"badge st-gai"};
    D.viewpoints.forEach(v=>{
      const card = el("div","vp"+(v.status==="叉"?" rejected":""));
      const head = el("div","vp-head");
      head.appendChild(el("span","vid",v.id.replace(/^v/,"观点")||v.id));
      if(has(v.slot)) head.appendChild(el("span","badge slot","〔"+v.slot+"〕"));
      head.appendChild(el("span",stBadge[v.status]||"badge", v.status||"未标"));
      if(has(v.confidence)) head.appendChild(el("span","badge","置信度："+v.confidence));
      card.appendChild(head);
      if(v.status==="改"){
        const panels = el("div","rev-panels");
        const p1 = el("div"); p1.appendChild(el("span","k","原句")); p1.appendChild(document.createTextNode(v.text||""));
        const p2 = el("div"); p2.appendChild(el("span","k","改后")); p2.appendChild(document.createTextNode(v.revisedText||""));
        panels.appendChild(p1); panels.appendChild(p2); card.appendChild(panels);
      }else{
        card.appendChild(el("p","text",v.text||""));
      }
      function row(k,val,build){
        if(!has(val)) return;
        const r = el("div","row"); r.appendChild(el("span","k",k));
        if(build) build(r); else r.appendChild(document.createTextNode(val));
        card.appendChild(r);
      }
      row("勾选备注：", v.reason);
      row("证据锚：", v.evidenceRefs, r=>{ v.evidenceRefs.forEach(f=>r.appendChild(el("span","fchip",f))); });
      row("拍板对应：", v.decisionFor);
      body.appendChild(card);
    });
  })();

  /* ── ④ 料包区 ── */
  (function(){
    const countText = (has(D.materials)||has(D.scraps))
      ? "材料 "+D.materials.length+" 条｜边角料 "+D.scraps.length+" 条" : null;
    const body = makeZone("z4","④ 料包区",countText,true);
    if(!has(D.materials) && !has(D.scraps)){ body.appendChild(emptyMsg()); return; }
    if(has(D.materialsNote)) body.appendChild(el("div","src-note",D.materialsNote));

    if(has(D.materials)){
      const catOrder = [], catMap = {};
      D.materials.forEach(m=>{
        const c = has(m.category)?m.category:"（未分类）";
        if(!catMap[c]){ catMap[c]=[]; catOrder.push(c); }
        catMap[c].push(m);
      });
      catOrder.forEach(c=>{
        const block = el("div","cat-block");
        block.appendChild(el("h3",null,c));
        catMap[c].forEach(m=>{
          const card = el("div","mat");
          const h = el("div","mhead");
          h.appendChild(el("span","fid",m.id));
          if(has(m.tier)) h.appendChild(el("span","badge",m.tier));
          card.appendChild(h);
          card.appendChild(el("p","summary",m.summary||""));
          if(has(m.source)) card.appendChild(el("p","meta-line","来源："+m.source));
          if(has(m.url)) card.appendChild(el("p","meta-line mono",m.url));
          block.appendChild(card);
        });
        body.appendChild(block);
      });
    }else{
      body.appendChild(emptyMsg());
    }

    body.appendChild(el("h3",null,"边角料箱（正文未用、可捞回）"));
    if(has(D.scraps)){
      D.scraps.forEach((s,i)=>{
        const card = el("div","scrap");
        card.appendChild(el("p",null,(i+1)+". "+(s.text||"")));
        if(has(s.whyUnused)) card.appendChild(el("p","why","为什么没用 / 可在哪用："+s.whyUnused));
        if(has(s.source)) card.appendChild(el("p","src mono",s.source));
        body.appendChild(card);
      });
    }else{
      body.appendChild(emptyMsg());
    }
  })();

  /* ── ⑤ 闸门区（默认折叠） ── */
  (function(){
    const body = makeZone("z5","⑤ 闸门区","闸门报告＋预检单",false);
    if(!has(D.gates) && !has(D.precheck.files)){ body.appendChild(emptyMsg()); return; }
    if(has(D.gates)){
      D.gates.forEach(g=>{
        const block = el("div","gate");
        block.appendChild(el("h3",null,g.name||"（未命名闸）"));
        if(has(g.violations)) g.violations.forEach(v=>block.appendChild(el("div","vio",v)));
        else block.appendChild(el("div","empty","本闸无违例"));
        body.appendChild(block);
      });
    }else{
      body.appendChild(emptyMsg());
    }
    body.appendChild(el("h3",null,"预检单读数（原文照录）"));
    if(has(D.precheck.files)){
      D.precheck.files.forEach(f=>{
        body.appendChild(el("h3",null,f.name||"预检单"));
        const pre = el("pre","raw"); pre.textContent = f.raw||"";
        body.appendChild(pre);
      });
    }else{
      body.appendChild(emptyMsg());
    }
  })();

  /* ── ⑥ 预读提词区（默认折叠） ── */
  (function(){
    const body = makeZone("z6","⑥ 预读提词区","顾问考题＋三翻模拟＋需作者定夺",false);
    if(!has(D.preread) && !has(D.decisions)){ body.appendChild(emptyMsg()); return; }
    if(has(D.preread)){
      D.preread.forEach(g=>{
        const block = el("div","voice-block");
        if(has(g.voice)) block.appendChild(el("h3",null,g.voice));
        if(has(g.questions)){
          const ol = el("ol");
          g.questions.forEach(q=>ol.appendChild(el("li",null,q)));
          block.appendChild(ol);
        }
        if(has(g.sanfan)){
          block.appendChild(el("h3",null,"三翻模拟（原文照录）"));
          block.appendChild(el("div","sanfan",g.sanfan));
        }
        body.appendChild(block);
      });
    }else{
      body.appendChild(emptyMsg());
    }
    body.appendChild(el("h3",null,"需作者定夺清单"));
    if(has(D.decisions)){
      const ol = el("ol");
      D.decisions.forEach(d=>ol.appendChild(el("li",null,d)));
      body.appendChild(ol);
    }else{
      body.appendChild(emptyMsg());
    }
  })();

  /* ── 进入视口淡入（一次性；reduced-motion 或不支持 IO 时直接呈现终态） ── */
  (function(){
    if(!("IntersectionObserver" in window)) return;
    if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const io = new IntersectionObserver(function(es){
      es.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add("io-in"); io.unobserve(en.target); } });
    }, {threshold:.08});
    document.querySelectorAll("details.zone, #notes-banner").forEach(function(e){ e.classList.add("io-pre"); io.observe(e); });
  })();
})();
</script>
</body>
</html>
