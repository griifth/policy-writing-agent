task:
  topic: "AI 教育政策热点识别与前沿研判"
  notebook_id: "b3d4fcf7-cefc-4cbc-8ccf-481b65b2651f"
  knowledge_mode: "notebooklm"
  audience: "教育政策研究人员"
  style: "policy_research_report"
  language: "zh-CN"
  assurance: "draft"
  traceability_owner: "notebooklm"
  use_existing_theme_taxonomy: true
  top_k_hotspots: 5
  sections:
    - hotspot
    - theme
    - comparison
    - impact
    - insight

execution:
  mode: "real"
  notebooklm_cli_path: "/Users/hujingkai/Desktop/notebookcli2report/notebooklm-py-main/.venv/bin/notebooklm"
  max_concurrency: 1
  source_deep_dive_limit: "all"
  source_deep_dive_lanes:
    - hotspot_rationale_deep_dive
    - core_material_deep_dive
    - comparison_deep_dive
    - impact_deep_dive
  output_root: "runs"
  overwrite_latest: true

agent_runtime:
  runtime_profile: "notebooklm_only"
  default_driver: "codex"
  knowledge_runtime:
    provider: "notebooklm_cli"
  orchestrator:
    driver: "codex"
  api_providers:
    openai:
      base_url: "https://api.openai.com/v1"
      api_key_env: "OPENAI_API_KEY"
      default_model: ""
      temperature: 0.2
      max_tokens: 1800
    anthropic:
      base_url: "https://api.anthropic.com/v1"
      api_key_env: "ANTHROPIC_API_KEY"
      default_model: ""
      temperature: 0.2
      max_tokens: 1800
    deepseek:
      base_url: "https://api.deepseek.com"
      api_key_env: "DEEPSEEK_API_KEY"
      default_model: "deepseek-v4-pro"
      temperature: 0.2
      max_tokens: 100000
  capability_policy:
    external_calls:
      - "notebooklm_cli"
    llm_api: false
    notebooklm_skill_mutation: false
  agents:
    QueryPlannerAgent:
      driver: "codex"
    MaterialPackAgent:
      driver: "codex"
    MatrixBuilderAgent:
      driver: "codex"
    SectionContractAgent:
      driver: "codex"
    SectionComposerAgent:
      driver: "codex"
      provider: "deepseek"
      model: "deepseek-v4-pro"
      max_tokens: 100000
    PlanReviewerAgent:
      driver: "codex"
    RetrievalCompletenessGate:
      driver: "codex"
    MaterialPackAudit:
      driver: "codex"
    MaterialCoverageReviewerAgent:
      driver: "codex"
    EvidenceUseReviewerAgent:
      driver: "codex"
    SectionContractReviewerAgent:
      driver: "codex"
    ClaimAuditAgent:
      driver: "codex"
    ReportQualityReviewerAgent:
      driver: "codex"
    DriftReviewerAgent:
      driver: "codex"
    KillArgumentAgent:
      driver: "codex"
    ReportAssembler:
      driver: "codex"

theme_taxonomy:
  - "AI 教育战略与国家规划"
  - "数字教育基础设施"
  - "教育大模型与生成式 AI"
  - "AI 素养与数字素养"
  - "教师 AI 能力与专业发展"
  - "课程、教学与学习方式变革"
  - "智能评估、学习分析与个性化学习"
  - "教育公平、包容性与弱势群体支持"
  - "数据治理、隐私、安全与伦理"
  - "AI 教育产业生态与公私合作"
  - "政策评估、实施监测与行动计划"
