task:
  topic: "AI 教育政策热点识别与前沿研判"
  notebook_id: "mock-notebook"
  knowledge_mode: "notebooklm"
  audience: "教育政策研究人员"
  style: "policy_research_report"
  language: "zh-CN"
  assurance: "draft"
  traceability_owner: "notebooklm"
  use_existing_theme_taxonomy: true
  top_k_hotspots: 5
  sections:
    - hotspot
    - theme
    - comparison
    - impact
    - insight

execution:
  mode: "mock"
  notebooklm_cli_path: "/Users/hujingkai/Desktop/notebookcli2report/notebooklm-py-main/.venv/bin/notebooklm"
  max_concurrency: 2
  output_root: "runs"
  overwrite_latest: true

agent_runtime:
  mode: "local"
  default_driver: "local"
  capability_policy:
    external_calls:
      - "notebooklm_cli"
    llm_api: false
    notebooklm_skill_mutation: false
  agents:
    QueryPlannerAgent:
      driver: "local"
    MaterialPackAgent:
      driver: "local"
    MatrixBuilderAgent:
      driver: "local"
    SectionContractAgent:
      driver: "local"
    SectionComposerAgent:
      driver: "local"
    PlanReviewerAgent:
      driver: "local"
    RetrievalCompletenessGate:
      driver: "local"
    MaterialPackAudit:
      driver: "local"
    MaterialCoverageReviewerAgent:
      driver: "local"
    EvidenceUseReviewerAgent:
      driver: "local"
    SectionContractReviewerAgent:
      driver: "local"
    ClaimAuditAgent:
      driver: "local"
    ReportQualityReviewerAgent:
      driver: "local"
    DriftReviewerAgent:
      driver: "local"
    KillArgumentAgent:
      driver: "local"
    ReportAssembler:
      driver: "local"

theme_taxonomy:
  - "AI 教育战略与国家规划"
  - "数字教育基础设施"
  - "教育大模型与生成式 AI"
  - "AI 素养与数字素养"
  - "教师 AI 能力与专业发展"
  - "课程、教学与学习方式变革"
  - "智能评估、学习分析与个性化学习"
  - "教育公平、包容性与弱势群体支持"
  - "数据治理、隐私、安全与伦理"
  - "AI 教育产业生态与公私合作"
  - "政策评估、实施监测与行动计划"
